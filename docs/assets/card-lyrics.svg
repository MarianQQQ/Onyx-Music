<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a10"/>
      <stop offset="60%" stop-color="#09080c"/>
      <stop offset="100%" stop-color="#050406"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e42"/>
      <stop offset="50%" stop-color="#4d0012"/>
      <stop offset="100%" stop-color="#ff2252"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="lyricsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="karaokeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* static */

    /* static */

    /* static */

    /* static */

    /* static */

    .border-runner {
      stroke-dasharray: none;
      opacity: 0.9;
    }

    .corner {
      opacity: 0.9;
    }

    .active-lyric {
      opacity: 0.9;
    }

    .note-bounce {
      opacity: 0.9;
    }
  </style>

  <!-- Card Background -->
  <rect x="0" y="0" width="480" height="260" rx="12" fill="url(#cardBg)" stroke="#1a1218" stroke-width="1"/>
  <rect x="8" y="8" width="464" height="244" rx="8" fill="none" stroke="#ff1e42" stroke-width="0.8" stroke-opacity="0.18"/>
  <rect class="border-runner" x="8" y="8" width="464" height="244" rx="8" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" filter="url(#lyricsGlow)"/>

  <!-- Animated Corner Brackets -->
  <g class="corner">
    <path d="M 6 26 L 6 6 L 26 6" fill="none" stroke="#ff1e42" stroke-width="3" stroke-linecap="round"/>
    <rect x="4" y="4" width="4" height="4" fill="#ffffff"/>
  </g>
  <g class="corner">
    <path d="M 454 6 L 474 6 L 474 26" fill="none" stroke="#ff1e42" stroke-width="3" stroke-linecap="round"/>
    <rect x="472" y="4" width="4" height="4" fill="#ffffff"/>
  </g>
  <g class="corner">
    <path d="M 6 234 L 6 254 L 26 254" fill="none" stroke="#ff1e42" stroke-width="3" stroke-linecap="round"/>
    <rect x="4" y="252" width="4" height="4" fill="#ffffff"/>
  </g>
  <g class="corner">
    <path d="M 454 254 L 474 254 L 474 234" fill="none" stroke="#ff1e42" stroke-width="3" stroke-linecap="round"/>
    <rect x="472" y="252" width="4" height="4" fill="#ffffff"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(24, 24)">
    <!-- Mic Icon -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#1f0a14" stroke="#ff1e42" stroke-width="1.2"/>
      <g class="note-bounce">
        <!-- Mic Capsule -->
        <rect x="14" y="8" width="8" height="13" rx="4" fill="#ff2252"/>
        <path d="M 11 15 C 11 19 25 19 25 15" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="18" y1="19" x2="18" y2="24" stroke="#ffffff" stroke-width="1.4"/>
        <line x1="14" y1="24" x2="22" y2="24" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>

    <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="0.5">
      SYNCED LYRICS + LRCLIB
    </text>
    <text x="46" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#ff4d6d" letter-spacing="1">
      LINE-BY-LINE STREAMING • INSTANT CALIBRATOR
    </text>

    <!-- Source Provider Badge -->
    <rect x="340" y="4" width="86" height="22" rx="6" fill="#ff1e42" fill-opacity="0.12" stroke="#ff1e42" stroke-width="1"/>
    <text x="383" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">LRCLIB API</text>
  </g>

  <!-- Interactive Karaoke Lyrics Mockup Frame -->
  <g transform="translate(24, 76)">
    <rect x="0" y="0" width="432" height="96" rx="8" fill="#120e15" stroke="#25161f" stroke-width="1"/>

    <!-- Previous Line -->
    <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#585a6a">
      [01:14.20]  City lights neon glowing in the dark...
    </text>

    <!-- Active Karaoke Line with Glow Background -->
    <rect x="10" y="36" width="412" height="30" rx="6" fill="#ff1e42" fill-opacity="0.12" stroke="#ff1e42" stroke-width="0.8"/>
    <polygon points="18,48 24,51 18,54" fill="#ff2252"/>
    <text class="active-lyric" x="30" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">
      [01:18.50]  Pulse goes fast, rhythm takes the lead ⚡
    </text>

    <!-- Next Line -->
    <text x="20" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#585a6a">
      [01:22.90]  Bass reverberates through cyber veins...
    </text>
  </g>

  <!-- Calibrator Tool Badge Bar -->
  <g transform="translate(24, 186)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace">
    <!-- Alt+Click Badge -->
    <rect x="0" y="0" width="138" height="26" rx="6" fill="#1b121c" stroke="#ff1e42" stroke-width="1"/>
    <text x="10" y="17" font-size="10" font-weight="700" fill="#00ff88">Alt + Click</text>
    <text x="76" y="17" font-size="9.5" fill="#c0c2d0">Sync Line</text>

    <!-- Micro Offset Steps -->
    <rect x="146" y="0" width="62" height="26" rx="6" fill="#181119" stroke="#331e28" stroke-width="1"/>
    <text x="177" y="17" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ff4d6d">-0.5s</text>

    <rect x="214" y="0" width="62" height="26" rx="6" fill="#181119" stroke="#331e28" stroke-width="1"/>
    <text x="245" y="17" text-anchor="middle" font-size="10.5" font-weight="700" fill="#00ff88">+0.5s</text>

    <!-- Persistence Tag -->
    <rect x="284" y="0" width="148" height="26" rx="6" fill="#181119" stroke="#331e28" stroke-width="1"/>
    <text x="358" y="17" text-anchor="middle" font-size="9.5" font-weight="600" fill="#888c9f">AUTO-SAVED TO DISK</text>
  </g>

  <!-- Footer Micro Status -->
  <g transform="translate(24, 236)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="9.5">
    <text x="0" y="0" fill="#606478">MV INTRO DESYNC: <tspan fill="#00ff88" font-weight="700">SOLVED FOREVER</tspan></text>
    <text x="432" y="0" text-anchor="end" fill="#ff4d6d">PRECISION: ±10ms</text>
  </g>
</svg>
