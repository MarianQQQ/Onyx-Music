<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a10"/>
      <stop offset="60%" stop-color="#09080c"/>
      <stop offset="100%" stop-color="#050406"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e42"/>
      <stop offset="50%" stop-color="#4d0012"/>
      <stop offset="100%" stop-color="#ff2252"/>
    </linearGradient>

    <linearGradient id="sliderActive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a001a"/>
      <stop offset="100%" stop-color="#ff2252"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="deckGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="knobGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* static */

    /* static */

    /* static */

    /* static */

    /* static */

    /* static */

    .border-runner {
      stroke-dasharray: none;
      opacity: 0.9;
    }

    .corner {
      opacity: 0.9;
    }

    .knob-bass {
      opacity: 0.9;
    }

    .knob-mid {
      opacity: 0.9;
    }

    .knob-treble {
      opacity: 0.9;
    }

    .stream-led {
      opacity: 0.9;
    }
  </style>

  <!-- Card Background -->
  <rect x="0" y="0" width="480" height="260" rx="12" fill="url(#cardBg)" stroke="#1a1218" stroke-width="1"/>
  <rect x="8" y="8" width="464" height="244" rx="8" fill="none" stroke="#ff1e42" stroke-width="0.8" stroke-opacity="0.18"/>
  <rect class="border-runner" x="8" y="8" width="464" height="244" rx="8" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" filter="url(#deckGlow)"/>

  <!-- Animated Corner Brackets -->
  <g class="corner">
    <path d="M 6 26 L 6 6 L 26 6" fill="none" stroke="#ff1e42" stroke-width="3" stroke-linecap="round"/>
    <rect x="4" y="4" width="4" height="4" fill="#ffffff"/>
  </g>
  <g class="corner">
    <path d="M 454 6 L 474 6 L 474 26" fill="none" stroke="#ff1e42" stroke-width="3" stroke-linecap="round"/>
    <rect x="472" y="4" width="4" height="4" fill="#ffffff"/>
  </g>
  <g class="corner">
    <path d="M 6 234 L 6 254 L 26 254" fill="none" stroke="#ff1e42" stroke-width="3" stroke-linecap="round"/>
    <rect x="4" y="252" width="4" height="4" fill="#ffffff"/>
  </g>
  <g class="corner">
    <path d="M 454 254 L 474 254 L 474 234" fill="none" stroke="#ff1e42" stroke-width="3" stroke-linecap="round"/>
    <rect x="472" y="252" width="4" height="4" fill="#ffffff"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(24, 24)">
    <!-- Sliders Icon -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#1f0a14" stroke="#ff1e42" stroke-width="1.2"/>
      <line x1="11" y1="9" x2="11" y2="27" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="11" cy="15" r="3" fill="#ff2252"/>
      <line x1="18" y1="9" x2="18" y2="27" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="18" cy="22" r="3" fill="#ff2252"/>
      <line x1="25" y1="9" x2="25" y2="27" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="25" cy="13" r="3" fill="#ff2252"/>
    </g>

    <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="0.5">
      AUDIOPHILE SOUND DECK
    </text>
    <text x="46" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#ff4d6d" letter-spacing="1">
      WASAPI EXCLUSIVE • 3-BAND EQ • CROSSFADER
    </text>

    <!-- WASAPI Exclusive Badge -->
    <rect x="330" y="4" width="96" height="22" rx="6" fill="#ff1e42" fill-opacity="0.15" stroke="#ff1e42" stroke-width="1"/>
    <circle class="stream-led" cx="340" cy="15" r="3.5" fill="#00ff88"/>
    <text x="350" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" fill="#ffffff" letter-spacing="0.6">WASAPI BIT</text>
  </g>

  <!-- 3-Band Equalizer Interactive Sliders -->
  <g transform="translate(24, 76)">
    <rect x="0" y="0" width="432" height="96" rx="8" fill="#120e15" stroke="#25161f" stroke-width="1"/>

    <!-- Bass Slider (100 Hz) -->
    <g transform="translate(16, 20)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#c0c4d4">BASS (100 Hz)</text>
      <text x="398" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700" fill="#ff4d6d">+4.5 dB</text>
      <!-- Track -->
      <line x1="0" y1="10" x2="400" y2="10" stroke="#261b24" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="260" y2="10" stroke="url(#sliderActive)" stroke-width="6" stroke-linecap="round"/>
      <!-- Animated Knob -->
      <g class="knob-bass">
        <circle cx="260" cy="10" r="7.5" fill="#ffffff" stroke="#ff1e42" stroke-width="2.5" filter="url(#knobGlow)"/>
      </g>
    </g>

    <!-- Mid Slider (1 kHz) -->
    <g transform="translate(16, 50)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#c0c4d4">MID (1.0 kHz)</text>
      <text x="398" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700" fill="#8d91a5">-1.2 dB</text>
      <!-- Track -->
      <line x1="0" y1="10" x2="400" y2="10" stroke="#261b24" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="180" y2="10" stroke="url(#sliderActive)" stroke-width="6" stroke-linecap="round"/>
      <!-- Animated Knob -->
      <g class="knob-mid">
        <circle cx="180" cy="10" r="7.5" fill="#ffffff" stroke="#ff1e42" stroke-width="2.5" filter="url(#knobGlow)"/>
      </g>
    </g>

    <!-- Treble Slider (3 kHz) -->
    <g transform="translate(16, 80)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#c0c4d4">TREBLE (3.0 kHz)</text>
      <text x="398" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700" fill="#00ff88">+6.0 dB</text>
      <!-- Track -->
      <line x1="0" y1="10" x2="400" y2="10" stroke="#261b24" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="310" y2="10" stroke="url(#sliderActive)" stroke-width="6" stroke-linecap="round"/>
      <!-- Animated Knob -->
      <g class="knob-treble">
        <circle cx="310" cy="10" r="7.5" fill="#ffffff" stroke="#ff1e42" stroke-width="2.5" filter="url(#knobGlow)"/>
      </g>
    </g>
  </g>

  <!-- Controls Deck Bar -->
  <g transform="translate(24, 186)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace">
    <!-- Crossfader Chip -->
    <rect x="0" y="0" width="138" height="26" rx="6" fill="#1b121c" stroke="#ff1e42" stroke-width="1"/>
    <text x="12" y="17" font-size="10" font-weight="700" fill="#ff4d6d">CROSSFADE</text>
    <text x="86" y="17" font-size="9.5" fill="#00ff88">0s → 12s</text>

    <!-- Pitch Preserved Speed -->
    <rect x="146" y="0" width="138" height="26" rx="6" fill="#181119" stroke="#331e28" stroke-width="1"/>
    <text x="158" y="17" font-size="10" font-weight="700" fill="#c0c2d0">PITCH LOCK</text>
    <text x="238" y="17" font-size="9.5" fill="#ff4d6d">0.5x-2x</text>

    <!-- Bit Depth -->
    <rect x="292" y="0" width="140" height="26" rx="6" fill="#181119" stroke="#331e28" stroke-width="1"/>
    <text x="362" y="17" text-anchor="middle" font-size="9.5" font-weight="600" fill="#888c9f">24-BIT / 48kHz HD</text>
  </g>

  <!-- Footer Micro Status -->
  <g transform="translate(24, 236)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="9.5">
    <text x="0" y="0" fill="#606478">RUST WEBAUDIO: <tspan fill="#00ff88" font-weight="700">EXCLUSIVE BUFFER ACTIVE</tspan></text>
    <text x="432" y="0" text-anchor="end" fill="#ff4d6d">ZERO AUDIO-JITTER</text>
  </g>
</svg>
