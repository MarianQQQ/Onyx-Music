<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#07070a"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <!-- Typography Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#ff3b5c"/>
    </linearGradient>

    <!-- Spectrum Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2a0810"/>
      <stop offset="30%" stop-color="#800b22"/>
      <stop offset="70%" stop-color="#e61e44"/>
      <stop offset="100%" stop-color="#ff5978"/>
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#ff1e42" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Filter for Aesthetics -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Fine Grid -->
    <pattern id="subtleGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <style>
    /* Laconic, gentle breathing glow (slow 6s cycle, non-distracting) */
    @keyframes gentleBreathe {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1.0; }
    }

    .ambient-deck {
      animation: gentleBreathe 6s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1000" height="280" rx="16" fill="url(#bgGrad)" stroke="#1c1822" stroke-width="1"/>
  <rect x="0" y="0" width="1000" height="280" rx="16" fill="url(#subtleGrid)"/>
  <rect x="0" y="0" width="1000" height="280" rx="16" fill="url(#ambientGlow)"/>

  <!-- Minimal Outer Border -->
  <rect x="12" y="12" width="976" height="256" rx="12" fill="none" stroke="#ff2244" stroke-width="1" stroke-opacity="0.18"/>

  <!-- Top Metadata Bar -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace">
    <!-- Version Chip -->
    <rect x="44" y="32" width="98" height="22" rx="6" fill="#ff1e42" fill-opacity="0.12" stroke="#ff1e42" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="93" y="47" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ff4d6d" letter-spacing="1">v0.2.0-STABLE</text>

    <!-- Architecture Pill -->
    <rect x="150" y="32" width="136" height="22" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.15"/>
    <text x="218" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#a0a5b8" letter-spacing="0.5">TAURI v2 • RUST 2024</text>

    <!-- Status Legend -->
    <text x="956" y="47" text-anchor="end" font-size="10.5" font-weight="600" fill="#75798e" letter-spacing="1.2">AUDIOPHILE DECK // ZERO ELECTRON BLOAT</text>
  </g>

  <!-- Central Branding & Logo -->
  <g transform="translate(48, 76)">
    <!-- Official Onyx Circular Emblem -->
    <g transform="translate(0, 4) scale(0.18)">
      <circle cx="256" cy="256" r="230" stroke="#ff2222" stroke-width="36" />
      <circle cx="256" cy="256" r="206" fill="#080808" stroke="#1c1c1c" stroke-width="3" />
      <circle cx="256" cy="256" r="162" stroke="#161616" stroke-width="2" fill="none" />
      <path d="M 218 162 L 338 256 L 218 350 Z" fill="#ff2222" stroke="#ff2222" stroke-width="6" stroke-linejoin="round" />
    </g>

    <!-- Typography -->
    <text x="110" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-size="44" letter-spacing="3" fill="url(#titleGrad)">
      ONYX
    </text>
    <text x="250" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="300" font-size="28" letter-spacing="4" fill="#6e7282">
      MUSIC
    </text>

    <!-- Stack Subtitle -->
    <text x="112" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#8c90a2" letter-spacing="1.5">
      TAURI v2 <tspan fill="#ff2252">•</tspan> RUST TOKIO <tspan fill="#ff2252">•</tspan> SOLIDJS <tspan fill="#ff2252">•</tspan> WASAPI DSP <tspan fill="#ff2252">•</tspan> &lt;65MB RAM
    </text>
  </g>

  <!-- Spectrum Visualizer (Static Balanced Audiophile Waveform) -->
  <g class="ambient-deck" transform="translate(0, 10)">
    <!-- Baseline -->
    <line x1="44" y1="210" x2="956" y2="210" stroke="#ff2244" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Harmonic Frequency Bars (24-Band Smooth Acoustic Curve) -->
    <rect x="44"  y="198" width="28" height="12" rx="3" fill="url(#barGrad)"/>
    <rect x="82"  y="186" width="28" height="24" rx="3" fill="url(#barGrad)"/>
    <rect x="120" y="170" width="28" height="40" rx="3" fill="url(#barGrad)"/>
    <rect x="158" y="152" width="28" height="58" rx="3" fill="url(#barGrad)"/>
    <rect x="196" y="162" width="28" height="48" rx="3" fill="url(#barGrad)"/>
    <rect x="234" y="140" width="28" height="70" rx="3" fill="url(#barGrad)"/>
    <rect x="272" y="128" width="28" height="82" rx="3" fill="url(#barGrad)"/>
    <rect x="310" y="146" width="28" height="64" rx="3" fill="url(#barGrad)"/>
    <rect x="348" y="134" width="28" height="76" rx="3" fill="url(#barGrad)"/>
    <rect x="386" y="118" width="28" height="92" rx="3" fill="url(#barGrad)"/>
    <rect x="424" y="130" width="28" height="80" rx="3" fill="url(#barGrad)"/>
    <rect x="462" y="106" width="28" height="104" rx="3" fill="url(#barGrad)"/>
    <rect x="500" y="114" width="28" height="96" rx="3" fill="url(#barGrad)"/>
    <rect x="538" y="126" width="28" height="84" rx="3" fill="url(#barGrad)"/>
    <rect x="576" y="142" width="28" height="68" rx="3" fill="url(#barGrad)"/>
    <rect x="614" y="132" width="28" height="78" rx="3" fill="url(#barGrad)"/>
    <rect x="652" y="150" width="28" height="60" rx="3" fill="url(#barGrad)"/>
    <rect x="690" y="164" width="28" height="46" rx="3" fill="url(#barGrad)"/>
    <rect x="728" y="156" width="28" height="54" rx="3" fill="url(#barGrad)"/>
    <rect x="766" y="172" width="28" height="38" rx="3" fill="url(#barGrad)"/>
    <rect x="804" y="180" width="28" height="30" rx="3" fill="url(#barGrad)"/>
    <rect x="842" y="188" width="28" height="22" rx="3" fill="url(#barGrad)"/>
    <rect x="880" y="196" width="28" height="14" rx="3" fill="url(#barGrad)"/>
    <rect x="918" y="202" width="28" height="8" rx="3" fill="url(#barGrad)"/>
  </g>

  <!-- Bottom Frequency Legend & Telemetry Chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="10" fill="#666a7c">
    <text x="44" y="244">20 Hz (SUB-BASS)</text>
    <text x="250" y="244">250 Hz (LOW-MID)</text>
    <text x="480" y="244" text-anchor="middle" fill="#ff4d6d">1.0 kHz (ACOUSTIC CORE)</text>
    <text x="710" y="244">4.0 kHz (PRESENCE)</text>
    <text x="956" y="244" text-anchor="end">20 kHz (AIR)</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="10.5">
    <text x="44" y="262" fill="#888c9e">RAM: <tspan fill="#00ff88" font-weight="700">&lt;65 MB</tspan></text>
    <text x="170" y="262" fill="#888c9e">IDLE CPU: <tspan fill="#00ff88" font-weight="700">0.0%</tspan></text>
    <text x="310" y="262" fill="#888c9e">STARTUP: <tspan fill="#00ff88" font-weight="700">&lt;0.8s</tspan></text>
    <text x="460" y="262" fill="#888c9e">AUDIO: <tspan fill="#ffffff" font-weight="700">WASAPI STREAM</tspan></text>
    <text x="680" y="262" fill="#888c9e">VIRTUALIZATION: <tspan fill="#ffffff" font-weight="700">60 FPS (3,000+ SONGS)</tspan></text>
    <text x="956" y="262" text-anchor="end" fill="#ff385c" font-weight="600">ZERO ELECTRON</text>
  </g>
</svg>
