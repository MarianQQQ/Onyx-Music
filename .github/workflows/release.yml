name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: tag_step
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: $TAG"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build Frontend & Tauri Bundle
        run: pnpm tauri build -b nsis

      - name: Package Release Binaries
        shell: pwsh
        run: |
          # 1. Locate and copy NSIS installer
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($nsis) {
            Copy-Item -Path $nsis.FullName -Destination "Onyx-Setup.exe" -Force
            Write-Host "Found installer: $($nsis.FullName) -> Onyx-Setup.exe"
          } else {
            Write-Error "NSIS installer binary not found!"
            exit 1
          }

          # 2. Locate and copy standalone executable
          $standalone = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" | Where-Object { $_.Name -like "*onyx*" -or $_.Name -like "*app*" } | Select-Object -First 1
          if ($standalone) {
            Copy-Item -Path $standalone.FullName -Destination "Onyx-Music.exe" -Force
            Write-Host "Found standalone: $($standalone.FullName) -> Onyx-Music.exe"
          } else {
            Write-Error "Standalone binary not found!"
            exit 1
          }

          Get-Item Onyx-Setup.exe, Onyx-Music.exe | Select-Object Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_step.outputs.tag }}
          name: Onyx Music ${{ steps.tag_step.outputs.tag }}
          files: |
            Onyx-Setup.exe
            Onyx-Music.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
